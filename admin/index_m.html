<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBE Heating Control Adapter Configuration</title>
    
    <!-- Load ioBroker styles and scripts -->
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css"/>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/selectID.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    
    <style>
        .m .col .select-wrapper+label {
            position: absolute;
            top: -26px;
            font-size: 0.8rem;
        }
        .select-wrapper+label {
            position: absolute;
            top: -26px;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="m adapter-container">
        
        <div class="row">
            <div class="col s12 m4 l2">
                <img src="rbe-heatingcontrol.png" class="logo">
            </div>
        </div>

        <!-- Put your content here -->

        <!-- For example columns with settings: -->
        <div class="row">
            <div class="col s6 input-field">
                <input type="text" class="value" id="cmiName" />
                <label for="cmiName" class="translate">CMI Name</label>
                <span class="translate">Name of your CMI device (e.g., cmi088364)</span>
            </div>
        </div>
        
        <div class="row">
            <div class="col s6 input-field">
                <input type="email" class="value" id="email" />
                <label for="email" class="translate">Email</label>
                <span class="translate">Your login email for the CMI portal</span>
            </div>
        </div>
        
        <div class="row">
            <div class="col s6 input-field">
                <input type="password" class="value" id="password" />
                <label for="password" class="translate">Password</label>
                <span class="translate">Your login password for the CMI portal</span>
            </div>
        </div>
        
        <div class="row">
            <div class="col s6 input-field">
                <input type="number" class="value" id="pollInterval" min="10000" max="300000" />
                <label for="pollInterval" class="translate">Poll Interval (ms)</label>
                <span class="translate">How often to poll for new data in milliseconds</span>
            </div>
        </div>

    </div>

</body>
</html>
